<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device=width, initial-scale-1.0">
    <title>Enquiry</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="LOGO">
            <h1>All Days Plumbing</h1>
        </div>
        <nav>
            <ul>
                <li><a href="Index.html" class="nav-box">Home</a></li>
                <li><a href="About_us.html">About Us</a></li>
                <li><a href="Services.html">Services</a></li>
                <li><a href="Enquiry.html">Enquiry</a></li>
                <li><a href="Contact_us.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="page-heading">
            <h2>Make an Enquiry</h2>
            <p>Tell Us What You Need, and one of our plumbers will gey back to you
                shortly
            </p>
        </section>
        <section class="Enquiry-form">
            <form action="#" method="post">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="email" required>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required>
                <label for="service">Service Needed</label>
                <select id="service" name="service">
                    <option value="emergancy">Emergency Callout</option>
                    <option value="gerser">Repair/Geyser Installastion</option>
                    <option value="drain">Drain/Sewer Unblocking</option>
                    <option value="pipes">Pipe Installastion</option>
                    <option value="bathroom">Bathroom/Kitchen Plumbing</option>
                    <option value="other">Other</option>
                </select>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Describe the issue
                    or work you need done."></textarea>
                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 All Days Plumbing. All rigts reserved.s</p>
    </footer>
</body>

</html>
